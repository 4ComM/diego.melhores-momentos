<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Melhores momentos · acesso restrito</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0f;--card:#14161b;--card2:#1b1e25;--ln:#2a2e38;--tx:#eef0f4;--mut:#9aa1ae;--ouro:#e8b835;--ouro2:#f6d36b}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Chakra Petch",system-ui,sans-serif}
header{position:relative;background:var(--bg);border-bottom:2px solid #c8102e;padding:12px 16px 10px}
h1{font-size:clamp(17px,4.6vw,24px);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
h1 small{color:var(--ouro);font-weight:600;margin-left:8px}
.cont{color:var(--mut);font-size:13px;margin-top:2px}
.cont b{color:var(--ouro2)}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip b{color:var(--mut);font-weight:600;margin-left:4px}
.chip.on{background:var(--ouro);border-color:var(--ouro);color:#111}.chip.on b{color:#333}
select,input[type=search]{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;min-width:0}
input[type=search]{flex:1 1 140px}
.dt{color:var(--mut);font-size:13px;display:flex;align-items:center;gap:5px}
input[type=date]{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 7px;font:inherit;font-size:13px;color-scheme:dark}
#jg{max-width:100%}
.sep{width:1px;height:20px;background:var(--ln);margin:0 2px}
main{padding:14px 16px 60px;max-width:1500px;margin:0 auto}
h2.gr{font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--ln);display:flex;align-items:baseline;gap:8px}
h2.gr i{font-style:normal;color:var(--ouro);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.c:hover,.c:focus-within{border-color:var(--ouro)}
.op{cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;background:none;border:0;display:flex;flex-direction:column;flex:1;width:100%}
.op:focus-visible{outline:2px solid var(--ouro);outline-offset:-2px}
.dl{display:block;text-align:center;border-top:1px solid var(--ln);padding:8px;font-size:13px;font-weight:600;color:var(--ouro2);text-decoration:none;background:var(--card2)}
.dl:hover{background:var(--ouro);color:#111}
.th{position:relative;aspect-ratio:16/9;background:#000 center/cover no-repeat}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.pl{position:absolute;inset:0;display:grid;place-items:center}
.pl span{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid #fff;display:grid;place-items:center}
.pl span:after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.tg{position:absolute;left:8px;top:8px;background:var(--ouro);color:#111;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase}
.id{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.6);font-size:11px;padding:2px 7px;border-radius:6px;color:var(--mut)}
.bd{padding:9px 11px 11px;display:flex;flex-direction:column;gap:3px}
.jg{font-weight:600;font-size:14px}
.mt{color:var(--mut);font-size:12px}
.es{color:var(--ouro);letter-spacing:2px;font-size:13px;min-height:16px}
.es u{text-decoration:none;color:#3a3f4b}
.tx{font-size:13px;color:#cfd3dc}
.vz{color:var(--mut);padding:40px 0;text-align:center}
#md{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:none;align-items:center;justify-content:center;padding:12px}
#md.on{display:flex}
.box{width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;gap:8px}
.vd{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.vd iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.in{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.in .t{flex:1 1 260px}
.nav{display:flex;gap:6px}
.nav button,.nav a{background:var(--card2);border:1px solid var(--ln);color:var(--tx);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.nav button:hover,.nav a:hover{border-color:var(--ouro)}
footer{color:var(--mut);font-size:12px;text-align:center;padding:10px 16px 30px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.sep{display:none}}
/* ---- elementos novos: invisiveis/neutros no computador ---- */
#fx{display:contents}
#ft{display:none}
.vd video{display:block;position:absolute;inset:0;width:100%;height:100%;background:#000}.vd iframe{display:none}
/* ---- celular e tablet estreito (o computador nao muda) ---- */
@media(max-width:700px),(pointer:coarse) and (max-width:1100px){
  html.mo{overflow:hidden}
  header{padding:10px 14px 12px;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  h1 small{display:block;margin:2px 0 0}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
  .top .cont{margin:0}
  #ft{display:inline-flex;align-items:center;gap:6px}
  #ftipo{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;margin:10px -14px 0;padding:2px 14px 6px;scrollbar-width:none}
  #ftipo::-webkit-scrollbar{display:none}
  #ftipo .chip{scroll-snap-align:start;flex:0 0 auto}
  .chip{min-height:40px;padding:8px 14px;font-size:14px}
  #f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  #f2 .dt input{min-width:0;width:100%}
  #f2 #ord,#f2 #jg,#f2 #q{grid-column:1/-1}
  #f2 .dt{display:grid;grid-template-columns:auto 1fr;gap:8px}
  select,input[type=search],input[type=date]{font-size:16px;min-height:44px;padding:8px 10px}
  #fx:not(.ab) #ftipo,#fx:not(.ab) #f2>:not(#ord){display:none}
  main{padding:8px 12px 50px}
  h2.gr{font-size:15px;margin:18px 0 8px;flex-wrap:wrap}
  .grid{gap:14px}
  .jg{font-size:15px}.mt{font-size:13px}.tx{font-size:14px}
  .dl{padding:13px 8px;font-size:14px}
  #md{padding:0;align-items:stretch;background:var(--bg)}
  .box{width:100%;height:100vh;height:100dvh;max-height:none;gap:0;overflow-y:auto;overscroll-behavior:contain}
  .vd{border-radius:0;position:sticky;top:0;z-index:2;flex:none}
  .vd video{display:block;position:absolute;inset:0;width:100%;height:100%;background:#000}
  .vd iframe{display:none}
  .vd.fb video{display:none}.vd.fb iframe{display:block}
  .in{padding:12px 14px calc(16px + env(safe-area-inset-bottom));padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));flex-direction:column;flex-wrap:nowrap;gap:12px}
  .in .t{flex:none}
  .nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .nav button,.nav a{min-height:48px;padding:10px;font-size:15px;text-align:center;display:flex;align-items:center;justify-content:center}
  #fc{grid-column:1/-1;background:var(--ouro);color:#111;border-color:var(--ouro);font-weight:700}
}
@media(max-width:950px) and (max-height:520px) and (orientation:landscape) and (pointer:coarse){
  .box{flex-direction:row;overflow:hidden}
  .vd{position:relative;flex:0 0 64%;align-self:center;height:100%;aspect-ratio:auto}
  .in{flex:1;overflow-y:auto;padding:10px 12px}
  .nav button,.nav a{min-height:42px;font-size:14px}
}
body.lk header,body.lk main,body.lk footer,body.lk #md{display:none}
#gate{display:none}body.lk #gate{display:grid;min-height:100vh;place-items:center;padding:20px}
#gf{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--ln);border-top:2px solid #c8102e;border-radius:12px;padding:22px}
#gf h1{font-size:18px}#gf p{color:var(--mut);font-size:13px}#gf input{font-size:16px;min-height:44px;padding:8px 12px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px}
#gf button{min-height:44px;font-weight:700}#ge{color:#ff8a8a;font-size:13px;min-height:18px}
</style>
</head>
<body class="lk"><div id="gate"><form id="gf" autocomplete="off"><h1>Acesso restrito</h1><p>Melhores momentos · 4ComM. Digite a senha para abrir.</p><input type="password" id="pw" placeholder="Senha" autocomplete="current-password" autofocus><button class="chip on" type="submit">Entrar</button><div id="ge"></div></form></div>
<header>
  <h1 id="nm">Melhores momentos<small></small></h1>
  <div class="top"><div class="cont" id="cont"></div><button class="chip" id="ft" aria-expanded="false" aria-controls="fx">Filtros ▾</button></div>
  <div id="fx">
  <div class="fl" id="ftipo"></div>
  <div class="fl" id="f2">
    <select id="est" aria-label="Estrelas"><option value="0">Todas as estrelas</option><option value="5">★★★★★</option><option value="4">★★★★ ou mais</option><option value="3">★★★ ou mais</option><option value="1">Com estrelas</option></select>
    <select id="jg" aria-label="Jogo"><option value="">Todos os jogos</option></select>
    <label class="dt">de <input type="date" id="de"></label><label class="dt">até <input type="date" id="ate"></label>
    <select id="ord" aria-label="Visualização"><option value="jogo">Por jogo, do mais recente ao mais antigo</option><option value="tipo">Por tipo, estrelas primeiro</option><option value="est">Por estrelas</option></select>
    <input type="search" id="q" placeholder="Buscar" aria-label="Buscar">
  </div>
  </div>
</header>
<main id="m"></main>
<footer>Lances selecionados e organizados pela 4ComM. Conteúdo de acesso restrito.</footer>
<div id="md" role="dialog" aria-modal="true" aria-label="Lance"><div class="box">
  <div class="vd" id="vdw"><video id="vv" controls playsinline preload="metadata"></video><iframe id="fr" allow="autoplay; fullscreen" allowfullscreen title="Vídeo do lance"></iframe></div>
  <div class="in"><div class="t"><div class="jg" id="mj"></div><div class="mt" id="mm"></div><div class="tx" id="mt"></div></div>
  <div class="nav"><button id="pv" aria-label="Anterior">← Anterior</button><button id="nx" aria-label="Próximo">Próximo →</button><a id="ab" rel="noopener">⬇ Baixar vídeo</a><button id="fc">Fechar ✕</button></div></div>
</div></div>
<script>
const SALT=Uint8Array.from(atob('xrwD1AAmhAPtDppImA7wLA=='),c=>c.charCodeAt(0));let KEY=null,D=null,TK=0;const URLS={};
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:SALT,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
async function dec(u){const r=await fetch(u);if(!r.ok)throw new Error('http');const b=new Uint8Array(await r.arrayBuffer());return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12))}
async function blobUrl(kind,id){const k=kind+id;if(!URLS[k]){const buf=await dec(kind+'/'+id+'.bin');URLS[k]=URL.createObjectURL(new Blob([buf],{type:kind==='v'?'video/mp4':'image/jpeg'}))}return URLS[k]}
async function baixar(id,el){const t=el.textContent;el.textContent='Preparando…';try{const u=await blobUrl('v',id);const l=document.createElement('a');l.href=u;l.download=id+'.mp4';document.body.appendChild(l);l.click();l.remove()}catch(_){}el.textContent=t}
async function iniciar(){D=JSON.parse(new TextDecoder().decode(await dec('d.bin')));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NOME=Object.fromEntries(D.tipos),ORD=D.tipos.map(t=>t[0]);
const dt=d=>d.split('-').reverse().join('/');
const jogo=x=>x.av?esc(x.cp):x.casa?`${D.clube} ${esc(x.pl)} ${esc(x.adv)}`:`${esc(x.adv)} ${esc(x.pl)} ${D.clube}`;
const tmp=x=>x.rel?(x.tp===1?'1T':x.tp===2?'2T':x.tp+'T')+' '+x.rel:'';
let tipo='',vis=[],atual=-1,pushed=false;
const MOB=matchMedia('(max-width:700px), (pointer:coarse) and (max-width:1100px)');
$('#nm small').textContent=D.nome+' · '+D.ano;
const chave=x=>x.dt+'|'+x.adv,jogos=new Map();D.lances.forEach(x=>{if(!jogos.has(chave(x)))jogos.set(chave(x),x)});
$('#jg').innerHTML+=[...jogos].sort((a,b)=>b[0].localeCompare(a[0])).map(([k,x])=>`<option value="${esc(k)}">${dt(x.dt)} · ${jogo(x)} · ${esc(x.cp)}</option>`).join('');
$('#de').min=$('#ate').min=[...jogos.keys()].sort()[0].slice(0,10);$('#de').max=$('#ate').max=[...jogos.keys()].sort().pop().slice(0,10);
function filtrados(){
  const q=$('#q').value.trim().toLowerCase(),e=+$('#est').value,g=$('#jg').value,de=$('#de').value,ate=$('#ate').value;
  return D.lances.filter(x=>(!tipo||x.t===tipo)&&(e===0||(e===1?x.s>0:x.s>=e))&&(!g||chave(x)===g)&&(!de||x.dt>=de)&&(!ate||x.dt<=ate)&&(!q||(x.tx+' '+x.adv+' '+x.cp+' '+NOME[x.t]).toLowerCase().includes(q)));
}
function ordena(l){
  const seg=x=>{if(!x.rel)return x.tp*100000+(x.o||0);const [m,s]=x.rel.split(':');return x.tp*100000+(+m)*60+(+s)};
  const o=$('#ord').value,c={jogo:(a,b)=>b.dt.localeCompare(a.dt)||a.adv.localeCompare(b.adv)||seg(a)-seg(b),tipo:(a,b)=>ORD.indexOf(a.t)-ORD.indexOf(b.t)||b.s-a.s||b.dt.localeCompare(a.dt),est:(a,b)=>b.s-a.s||ORD.indexOf(a.t)-ORD.indexOf(b.t)||b.dt.localeCompare(a.dt)};
  return [...l].sort(c[o]);
}
const est=n=>n?'★'.repeat(n)+'<u>'+'★'.repeat(5-n)+'</u>':'';
const baixa=x=>'#';
function card(x){
  const i=vis.indexOf(x);
  return `<article class="c"><button class="op" data-i="${i}"><div class="th"><img loading="lazy" decoding="async" alt="" data-p="${x.id}" onerror="this.remove()"><div class="pl"><span></span></div><span class="id">${x.id}</span></div>
  <div class="bd"><div class="es">${est(x.s)}</div><div class="jg">${jogo(x)}</div><div class="mt">${dt(x.dt)} · ${esc(x.cp)}${tmp(x)?' · '+tmp(x):''}</div><div class="tx">${esc(x.tx)}</div></div></button><a class="dl" href="#" data-dl="${x.id}">⬇ Baixar vídeo</a></article>`;
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);const im=e.target;blobUrl('p',im.dataset.p).then(u=>{im.src=u}).catch(()=>im.remove())}}),{rootMargin:'300px'});
function posters(){document.querySelectorAll('img[data-p]:not([src])').forEach(im=>io.observe(im))}
function desenha(){desenha0();posters()}
function desenha0(){
  const l=ordena(filtrados());vis=l;
  $('#cont').innerHTML=`<b>${l.length}</b> de ${D.lances.length} lances`;
  if(!l.length){$('#m').innerHTML='<div class="vz">Nenhum lance com esses filtros.</div>';return}
  if($('#ord').value==='jogo'){
    let h='',ult='';for(const x of l){const k=chave(x);if(k!==ult){if(ult)h+='</div>';ult=k;const n=l.filter(y=>chave(y)===k).length;h+=`<h2 class="gr">${dt(x.dt)} · ${jogo(x)}<i>${n} ${n>1?'lances':'lance'} · ${esc(x.cp)}</i></h2><div class="grid">`}h+=card(x)}
    $('#m').innerHTML=h+'</div>';
  }else if($('#ord').value==='tipo'){
    let h='';for(const [k,n] of D.tipos){const g=l.filter(x=>x.t===k);if(g.length)h+=`<h2 class="gr">${n}<i>${g.length}</i></h2><div class="grid">${g.map(card).join('')}</div>`}
    $('#m').innerHTML=h;
  }else $('#m').innerHTML=`<div class="grid" style="margin-top:14px">${l.map(card).join('')}</div>`;
}
function chips(){
  const base=D.lances;
  $('#ftipo').innerHTML=`<button class="chip ${tipo?'':'on'}" data-t="">Todos os tipos<b>${base.length}</b></button>`+D.tipos.map(([k,n])=>{const c=base.filter(x=>x.t===k).length;return c?`<button class="chip ${tipo===k?'on':''}" data-t="${k}">${n}<b>${c}</b></button>`:''}).join('');
}
function abre(i){
  if(i<0||i>=vis.length)return;atual=i;const x=vis[i];
  const dw=$('#vdw'),vv=$('#vv');dw.classList.remove('fb');
  $('#fr').src='about:blank';vv.removeAttribute('src');vv.poster='';const tk=++TK;
  blobUrl('p',x.id).then(u=>{if(tk===TK)vv.poster=u}).catch(()=>{});
  blobUrl('v',x.id).then(u=>{if(tk!==TK)return;vv.src=u;const pr=vv.play();if(pr&&pr.catch)pr.catch(()=>{})}).catch(()=>{});
  if(!pushed){history.pushState({m:1},'');pushed=true}
  $('#mj').innerHTML=`${jogo(x)} <span class="es">${est(x.s)}</span>`;
  $('#mm').textContent=[dt(x.dt),x.cp,tmp(x),NOME[x.t]].filter(Boolean).join(' · ');
  $('#mt').textContent=x.tx;$('#ab').href='#';$('#ab').dataset.dl=x.id;
  $('#md').classList.add('on');document.documentElement.classList.add('mo');$('.box').scrollTop=0;$('#pv').disabled=i===0;$('#nx').disabled=i===vis.length-1;
}
function esconde(){const vv=$('#vv');vv.onerror=null;vv.pause();vv.removeAttribute('src');vv.removeAttribute('poster');vv.load();$('#md').classList.remove('on');document.documentElement.classList.remove('mo');$('#fr').src='about:blank';atual=-1}
function fecha(){if(pushed){pushed=false;history.back()}esconde()}
addEventListener('popstate',()=>{if(atual>=0){pushed=false;esconde()}});
$('#ft').addEventListener('click',()=>{const a=$('#fx').classList.toggle('ab');$('#ft').setAttribute('aria-expanded',a);$('#ft').textContent=a?'Filtros ▴':'Filtros ▾'});
MOB.addEventListener('change',()=>{desenha()});
document.addEventListener('click',e=>{
  const dl=e.target.closest('[data-dl]');if(dl){e.preventDefault();return baixar(dl.dataset.dl,dl)}
  const c=e.target.closest('.op');if(c)return abre(+c.dataset.i);
  const t=e.target.closest('[data-t]');if(t){tipo=t.dataset.t;chips();return desenha()}
  if(e.target.id==='md'||e.target.id==='fc')fecha();
  if(e.target.id==='pv')abre(atual-1);if(e.target.id==='nx')abre(atual+1);
});
document.addEventListener('keydown',e=>{if(atual<0)return;if(e.key==='Escape')fecha();if(e.key==='ArrowLeft')abre(atual-1);if(e.key==='ArrowRight')abre(atual+1)});
['#est','#jg','#ord','#de','#ate'].forEach(s=>$(s).addEventListener('change',desenha));$('#q').addEventListener('input',desenha);
chips();desenha();
}
const GF=document.getElementById('gf'),PW=document.getElementById('pw'),GE=document.getElementById('ge');
async function entrar(pw){KEY=await derive(pw);await iniciar();document.body.classList.remove('lk');try{sessionStorage.setItem('pw',pw)}catch(_){}}
GF.addEventListener('submit',async e=>{e.preventDefault();GE.textContent='';try{await entrar(PW.value)}catch(_){KEY=null;GE.textContent='Senha incorreta.'}});
try{const s=sessionStorage.getItem('pw');if(s)entrar(s).catch(()=>{try{sessionStorage.removeItem('pw')}catch(_){}})}catch(_){}
</script>
</body>
</html>
